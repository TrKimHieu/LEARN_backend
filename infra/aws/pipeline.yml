AWSTemplateFormatVersion: '2010-09-09'
Description: LEARN CI/CD shared resources. ECR repositories, deploy bundle bucket and the GitHub OIDC build role.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organization that owns both repositories.
  GitHubOwnerId:
    Type: String
    AllowedPattern: '^[0-9]+$'
    Description: Numeric ID of the GitHub owner, used in immutable OIDC subjects.
  BackendRepo:
    Type: String
    Default: LEARN_backend
  BackendRepoId:
    Type: String
    AllowedPattern: '^[0-9]+$'
    Description: Numeric ID of the backend repository, used in immutable OIDC subjects.
  WebRepo:
    Type: String
  WebRepoId:
    Type: String
    AllowedPattern: '^[0-9]+$'
    Description: Numeric ID of the web repository, used in immutable OIDC subjects.
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false if this AWS account already has the GitHub OIDC provider.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: learn/api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the 30 newest images for rollback","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}

  WorkerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: learn/worker
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the 30 newest images for rollback","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}

  MigrateRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: learn/migrate
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the 30 newest images for rollback","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}

  WebRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: learn/web
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the 30 newest images for rollback","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}

  DeployBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-bundles
            Status: Enabled
            ExpirationInDays: 90

  # Only the main branch of the two repositories can publish images.
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: learn-github-build
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${BackendRepo}@${BackendRepoId}:ref:refs/heads/main
                  - !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${WebRepo}@${WebRepoId}:ref:refs/heads/main
      Policies:
        - PolicyName: push-images-and-bundle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt ApiRepository.Arn
                  - !GetAtt WorkerRepository.Arn
                  - !GetAtt MigrateRepository.Arn
                  - !GetAtt WebRepository.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${DeployBucket.Arn}/onebox/*

Outputs:
  BuildRoleArn:
    Value: !GetAtt BuildRole.Arn
  DeployBucketName:
    Value: !Ref DeployBucket
    Export:
      Name: learn-deploy-bucket
  EcrRepositoryArnPrefix:
    Value: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/learn
    Export:
      Name: learn-ecr-arn-prefix
