name: learn-m1-sandbox
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learn_m1
      POSTGRES_PASSWORD: learn_m1
      POSTGRES_DB: learn_m1
    ports: ['127.0.0.1:15432:5432']
    volumes: [m1-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learn_m1 -d learn_m1']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:16379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio@sha256:709099319add48dfb44aa596a7070d3ddd8dd04d7ae881765719aec29df9e510
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: learnm1local
      MINIO_ROOT_PASSWORD: learnm1local-only
    ports: ['127.0.0.1:19000:9000']
    volumes: [m1-storage:/data]

volumes:
  m1-postgres:
  m1-storage:
