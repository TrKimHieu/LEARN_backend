name: Backend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:tooling
      - run: npm run contracts:pack
      - run: npm run contracts:consumer
      - run: npm run build
      - run: npm run sandbox:up
      - run: npm run sandbox:compare
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: private-sandbox-diagnostics
          path: |
            .local/pilot-comparison.log
            .local/sandbox.log
          include-hidden-files: true
          retention-days: 3
      - if: always()
        run: npm run sandbox:stop
